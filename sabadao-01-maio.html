<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>COAGRO – Promoções da Semana</title>
  <link rel="icon" type="image/svg+xml" href="https://www.grupocoagro.com/logos/Logo%20Coagro%20branco.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --coagro-green: #004B3C;
      --coagro-light-green: #00796B;
      --coagro-blue: #001C71;
      --coagro-gold: #FFB800;
      --pet-primary: #4a148c;
      --pet-blue: #4897D0;
      --pet-orange: #E96C2C;
      --pet-green: #73B230;
      --bg: #f4f6f4;
      --card-bg: #ffffff;
      --text: #213547;
      --text-muted: #6b7280;
      --radius: 14px;
      --shadow: 0 4px 24px -6px rgba(0,75,60,0.13);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      background: var(--coagro-green);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo-wrap { display: flex; align-items: center; gap: 12px; }
    .logo-wrap img {
      height: 42px;
      width: auto;
      filter: brightness(0) invert(1);
    }
    .header-title {
      color: #fff;
      font-size: 0.78rem;
      font-weight: 500;
      opacity: 0.85;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── BANNER CONTADOR ── */
    .promo-banner {
      background: linear-gradient(135deg, var(--coagro-gold) 0%, #e6a200 100%);
      padding: 12px 20px;
      text-align: center;
    }
    .promo-banner-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .promo-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--coagro-green);
      color: #fff;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 5px 14px;
      border-radius: 50px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .promo-status-badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--coagro-gold);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    .countdown-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--coagro-green);
      font-size: 0.85rem;
    }
    .countdown-unit {
      background: var(--coagro-green);
      color: #fff;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 1.1rem;
      font-weight: 800;
      min-width: 44px;
      text-align: center;
      line-height: 1.3;
    }
    .countdown-unit span { display: block; font-size: 0.55rem; font-weight: 500; opacity: 0.8; text-transform: uppercase; }
    .countdown-sep { font-size: 1.2rem; font-weight: 800; color: var(--coagro-green); }

    /* SÁBADO ATIVA */
    .status-ativa .promo-status-badge { background: #16a34a; }
    .status-ativa .promo-status-badge .dot { background: #bbf7d0; }
    .status-ativa .countdown-wrap { display: none; }
    .status-ativa .promo-banner { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }
    .status-ativa .promo-status-badge { color: #fff; }
    .status-ativa .promo-banner-inner .promo-msg { color: #fff; font-weight: 700; font-size: 0.95rem; }

    /* ── MAIN ── */
    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }

    /* ── SEARCH ── */
    .search-wrap {
      margin-bottom: 20px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      border: 2px solid #e5e7eb;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: var(--transition);
      -webkit-appearance: none;
    }
    .search-wrap input:focus { border-color: var(--coagro-light-green); box-shadow: 0 0 0 3px rgba(0,121,107,0.12); }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--coagro-light-green);
      pointer-events: none;
    }

    /* ── CATEGORIAS ── */
    .cats-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .cats-scroll::-webkit-scrollbar { display: none; }
    .cat-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: 50px;
      border: 2px solid transparent;
      background: #fff;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      -webkit-tap-highlight-color: transparent;
    }
    .cat-btn:hover, .cat-btn.active {
      background: var(--coagro-green);
      color: #fff;
      border-color: var(--coagro-green);
      box-shadow: 0 4px 16px rgba(0,75,60,0.2);
    }
    .cat-btn .cat-icon { font-size: 1.1rem; }

    /* ── GRID CARDS ── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    @media (max-width: 480px) {
      .products-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    }
    @media (max-width: 340px) {
      .products-grid { grid-template-columns: 1fr; }
    }

    /* ── CARD ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      border: 1px solid rgba(0,75,60,0.06);
      animation: fadeInUp 0.4s ease-out both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 36px -8px rgba(0,75,60,0.18); }

    .card-cat-strip {
      height: 5px;
      background: var(--coagro-green);
    }
    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 50px;
      background: #fef9ee;
      color: #b45309;
      border: 1px solid #fcd34d;
      width: fit-content;
    }
    .card-badge.active-badge {
      background: #dcfce7;
      color: #15803d;
      border-color: #86efac;
    }

    .card-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      flex: 1;
    }
    .card-code { font-size: 0.72rem; color: var(--text-muted); }

    .card-price-wrap { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
    .card-price {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--coagro-green);
      line-height: 1;
    }
    .card-price-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 2px; }

    .card-footer { padding: 0 16px 16px; }
    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-whatsapp:hover, .btn-whatsapp:active { background: #1da851; transform: scale(0.98); }
    .btn-whatsapp svg { flex-shrink: 0; }

    /* ── CAT COLORS ── */
    .cat-agro .card-cat-strip { background: var(--coagro-green); }
    .cat-defensivos .card-cat-strip { background: #16a34a; }
    .cat-medicamentos .card-cat-strip { background: #dc2626; }
    .cat-pet .card-cat-strip { background: var(--pet-primary); }
    .cat-pet .card-price { color: var(--pet-primary); }
    .cat-casa .card-cat-strip { background: var(--coagro-blue); }
    .cat-casa .card-price { color: var(--coagro-blue); }
    .cat-maquinas .card-cat-strip { background: #92400e; }
    .cat-maquinas .card-price { color: #92400e; }
    .cat-maquinas .btn-whatsapp { background: #92400e; }
    .cat-maquinas .btn-whatsapp:hover { background: #78350f; }

    /* ── EMPTY ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-state svg { opacity: 0.3; margin-bottom: 12px; }
    .empty-state p { font-size: 1rem; font-weight: 500; }

    /* ── FOOTER ── */
    footer {
      background: var(--coagro-green);
      color: rgba(255,255,255,0.75);
      text-align: center;
      padding: 20px;
      font-size: 0.78rem;
      margin-top: 40px;
    }
    footer strong { color: var(--coagro-gold); }

    /* ── RESULTS COUNT ── */
    .results-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      font-weight: 500;
    }
  </style>
</head>

</main>

// ══════════════════════════════════════════
//  CONTADOR / STATUS SÁBADO
// ══════════════════════════════════════════
function updateCountdown() {
  const now = new Date();
  const day = now.getDay(); // 0=dom,1=seg,...,6=sáb
  const banner = document.getElementById('promoBanner');
  const statusText = document.getElementById('statusText');
  const promoMsg = document.getElementById('promoMsg');
  const countdownWrap = document.getElementById('countdownWrap');

  if (day === 6) {
    // É SÁBADO → PROMOÇÃO ATIVA
    banner.classList.add('status-ativa');
    statusText.textContent = '🔥 PROMOÇÃO ATIVA HOJE!';
    promoMsg.style.display = 'block';
    countdownWrap.style.display = 'none';
    return;
  }

  // Calcular próximo sábado
  const daysUntilSat = (6 - day + 7) % 7 || 7;
  const nextSat = new Date(now);
  nextSat.setDate(now.getDate() + daysUntilSat);
  nextSat.setHours(0, 0, 0, 0);

  const diff = nextSat - now;
  if (diff <= 0) return;

  const dias  = Math.floor(diff / (1000 * 60 * 60 * 24));
  const horas = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const min   = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const sec   = Math.floor((diff % (1000 * 60)) / 1000);

  document.getElementById('cdDias').innerHTML  = dias  + '<span>dias</span>';
  document.getElementById('cdHoras').innerHTML = String(horas).padStart(2,'0') + '<span>horas</span>';
  document.getElementById('cdMin').innerHTML   = String(min).padStart(2,'0')   + '<span>min</span>';
  document.getElementById('cdSec').innerHTML   = String(sec).padStart(2,'0')   + '<span>seg</span>';
}
updateCountdown();
setInterval(updateCountdown, 1000);

function buildWAMsg(p) {
  const isSab = new Date().getDay() === 6;
  const status = isSab ? '🔥 *PROMOÇÃO ATIVA HOJE!*' : '⏳ *Promoção válida no sábado!*';
  return encodeURIComponent(
    `${status}\n\n` +
    `Olhe só que condição especial da COAGRO neste produto!\n\n` +
    `🛒 *${p.nome}*\n` +
    `💰 *${p.preco}*\n\n` +
    `Fale comigo agora e aproveite este precinho especial que só quem tem é COAGRO! 💚\n` +
    `📍 Alagoas · Sergipe · Bahia`
  );
}

function renderProducts() {
  const grid = document.getElementById('productsGrid');
  const info = document.getElementById('resultsInfo');
  const isSab = new Date().getDay() === 6;

  const filtered = produtos.filter(p => {
    const matchCat = currentCat === 'all' || p.cat === currentCat;
    const matchSearch = p.nome.toLowerCase().includes(searchTerm) ||
                        p.id.toLowerCase().includes(searchTerm);
    return matchCat && matchSearch;
  });

  info.textContent = filtered.length > 0
    ? `${filtered.length} produto${filtered.length > 1 ? 's' : ''} encontrado${filtered.length > 1 ? 's' : ''}`
    : '';

  if (filtered.length === 0) {
    grid.innerHTML = `

    return;

  grid.innerHTML = filtered.map((p, i) => {
    const cat = catLabels[p.cat] || { label: p.cat, icon: '📦' };

    return `
      <div class="card cat-${p.cat}" style="animation-delay:${Math.min(i * 0.04, 0.5)}s">
        <div class="card-cat-strip"></div>
        <div class="card-body">

function filterCat(btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  renderProducts();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('searchInput').addEventListener('input', function() {
  searchTerm = this.value.toLowerCase().trim();
  renderProducts();
});
